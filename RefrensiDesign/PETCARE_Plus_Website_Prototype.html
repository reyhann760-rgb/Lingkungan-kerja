function renderLanding(){pageRoot(`<div class="landing fade-in"><div class="landing-nav-space"></div><nav class="floating-nav ${state.menu?'menu-open':''}" id="site-nav">${brand()}<div class="top-links"><a href="#beranda" onclick="App.closeMenu()">Beranda</a><a href="#layanan" onclick="App.closeMenu()">Layanan</a><a href="#tentang" onclick="App.closeMenu()">Tentang Kami</a></div><div style="display:flex;align-items:center;gap:9px"><button class="green-btn landing-nav-login" onclick="App.goto('login')">${ico('user','i-sm')} Masuk Admin</button><button class="icon-btn nav-menu-button" aria-label="Buka menu" onclick="App.toggleMenu()">${ico('menu')}</button></div></nav>
<main><div class="landing-wrap"><section id="beranda" class="hero"><div class="hero-text"><span class="hero-kicker">${ico('shield','i-sm')} Klinik Hewan Terintegrasi & Tepercaya</span><h1>Perawatan terbaik untuk <em>sahabat berbulu</em> Anda.</h1><p>Reservasi pemeriksaan tanpa repot, pantau antrean secara praktis, dan simpan riwayat kesehatan hewan kesayangan dalam satu ekosistem PETCARE+.</p><div class="hero-actions"><a href="#layanan" class="green-btn">${ico('calendar','i-sm')} Jelajahi Layanan ${ico('arrow','i-sm')}</a><a href="#tentang" class="outline-btn">${ico('info','i-sm')} Tentang PETCARE+</a></div><div class="hero-social"><span class="avatar-stack"><span class="mini-avatar">🐶</span><span class="mini-avatar">🐱</span><span class="mini-avatar">🐰</span></span><span>Lebih mudah menjaga hewan kesayangan<br><strong>Peduli • Terhubung • Teratur</strong></span></div></div><div class="hero-display"><div class="hero-orb"></div><img class="hero-art" alt="Ilustrasi dokter hewan dengan anjing dan kucing" src="${HERO_IMAGE}"><div class="float-tag one">${ico('checkcircle')}<div><strong>Pet Health First</strong><small>Kesehatan peliharaan utama</small></div></div><div class="float-tag two">${ico('calendar')}<div><strong>Reservasi Mudah</strong><small>Jadwal dalam satu sentuhan</small></div></div></div></section>
<section id="layanan" class="landing-section"><div class="section-head"><span class="section-eyebrow">Apa yang kami lakukan</span><h2 class="section-title">Layanan untuk setiap<br>tahap kehidupan mereka.</h2><p>Dari pemeriksaan rutin hingga perawatan lanjutan, pengalaman kesehatan yang lebih terencana untuk sahabat kesayangan.</p></div><div class="service-grid">${[['stethoscope','Pemeriksaan Umum','Pemeriksaan kondisi kesehatan, evaluasi rutin, dan rekomendasi tindakan.'],['syringe','Vaksinasi','Perlindungan kesehatan dengan jadwal imunisasi dan pengingat booster.'],['heart','Konsultasi Dokter','Diskusikan keluhan kesehatan hewan dengan dokter yang berpengalaman.'],['paw','Perawatan Hewan','Perawatan berkala dan pemantauan kesehatan hewan secara terarah.']].map(([i,t,d])=>`<article class="service-card glass"><div class="service-art">${ico(i,'i-xl')}</div><h3>${t}</h3><p>${d}</p><a class="arrow-link" href="#cara-kerja">Pelajari alur ${ico('arrow','i-sm')}</a></article>`).join('')}</div></section>
<section id="cara-kerja" class="landing-section" style="padding-top:30px"><div class="how-wrap"><div class="section-head center"><span class="section-eyebrow">Langkah sederhana</span><h2 class="section-title">Cara kerja PETCARE<span style="color:#438957">+</span></h2><p>Empat tahap yang membuat kunjungan klinik lebih praktis dan tertata.</p></div><div class="steps">${[['user','Registrasi Hewan','Daftarkan identitas dan informasi dasar hewan peliharaan.'],['calendar','Pilih & Reservasi','Tentukan dokter, layanan, serta waktu pemeriksaan.'],['clock','Dapatkan Antrean','Pantau nomor antrean dan status layanan terkini.'],['checkcircle','Pemeriksaan Selesai','Akses catatan hasil pemeriksaan dan pengingat vaksin.']].map(([i,t,d],idx)=>`<div class="step"><span class="step-num">LANGKAH 0${idx+1}</span><div class="step-icon">${ico(i,'i-lg')}</div><h3>${t}</h3><p>${d}</p>${idx<3?`<span class="step-sep">${ico('chevron','i-sm')}</span>`:''}</div>`).join('')}</div></div></section>
<section id="tentang" class="landing-section feature-layout"><div><span class="section-eyebrow">Kenapa PETCARE+?</span><h2 class="section-title">Lebih tenang saat<br>merawat yang tersayang.</h2><p class="muted" style="font-size:13px;max-width:480px">Dibuat untuk mempermudah pemilik hewan dan tim klinik bekerja lebih terhubung. Informasi layanan dapat diakses melalui sistem yang terintegrasi.</p><div class="feature-grid">${[['calendar','Reservasi Online','Pilih jadwal dan layanan sesuai kebutuhan.'],['activity','Monitoring Antrean','Pantau progres pelayanan yang sedang berjalan.'],['clipboard','Riwayat Kesehatan','Catatan pemeriksaan tersimpan terpusat.'],['bell','Pengingat Vaksin','Jadwal vaksin berikutnya lebih mudah diingat.']].map(([i,t,d])=>`<div class="feature-small glass"><div class="surface-icon">${ico(i)}</div><h3>${t}</h3><p>${d}</p></div>`).join('')}</div></div><div class="queue-showcase"><div class="queue-visual"><div style="display:flex;justify-content:space-between;align-items:center"><span class="badge">${ico('paw','i-sm')} LIVE QUEUE</span>${ico('more')}</div><div class="queue-main"><div style="font-size:10px;font-weight:700;color:#b9dfc4">NOMOR ANTREAN ANDA</div><div class="number">A-023</div><div style="font-size:11px;color:#b9dfc4">Mochi • Pemeriksaan Umum</div></div><div style="display:flex;justify-content:space-between;font-size:11px;font-weight:800;margin-bottom:12px"><span>Progres layanan</span><span style="color:#338653">75%</span></div><div class="queue-track"><b></b></div><div style="display:flex;justify-content:space-between;color:#7e9383;margin-top:12px;font-size:10px"><span>Menunggu</span><span>Konfirmasi</span><span style="color:#367b4a;font-weight:800">Dilayani</span><span>Selesai</span></div></div><span class="leaf" style="width:80px;height:150px;left:0;bottom:0"></span><span class="leaf" style="width:75px;height:130px;right:4%;top:0;transform:rotate(-45deg)"></span></div></section></div></main>
<footer class="landing-footer"><div class="landing-wrap"><div class="footer-grid"><div>${brand(true)}<p style="max-width:280px;margin-top:16px">Solusi reservasi dan monitoring kesehatan hewan yang dirancang agar pemilik hewan serta tenaga klinik lebih terhubung.</p></div><div><h4>Navigasi</h4><a href="#beranda">Beranda</a><a href="#layanan">Layanan</a><a href="#tentang">Tentang Kami</a></div><div><h4>Fitur Layanan</h4><a href="#layanan">Pemeriksaan</a><a href="#cara-kerja">Reservasi</a><a href="#tentang">Monitoring Antrean</a><a href="#tentang">Vaksinasi</a></div><div><h4>Informasi Klinik</h4><p>Email: hello@petcareplus.id<br>Alamat: Klinik PETCARE+ (simulasi)<br>Senin–Sabtu, 08.00–17.00 WIB</p></div></div><div class="footer-bottom"><span>© ${new Date().getFullYear()} PETCARE+ — Interactive Website Prototype</span><span>Desain terintegrasi, data contoh, bukan sistem klinik aktif.</span></div></div></footer></div>`)}
function renderLogin(){state.menu=false;pageRoot(`<div class="login-screen fade-in"><aside class="login-aside">${brand()}<img src="${HERO_IMAGE}" alt="Dokter hewan, anjing, dan kucing"><div><h2>Satu tempat untuk merawat seluruh layanan klinik.</h2><p>Kelola reservasi, data hewan, antrean, dan riwayat pemeriksaan lebih mudah bersama PETCARE+.</p></div></aside><div class="login-form-side"><button class="back-link" onclick="App.goto('landing')">${ico('arrow','i-sm')} Kembali ke Beranda</button><div class="login-box glass">${brand()}<h1>Selamat datang.</h1><p>Masuk sebagai administrator untuk membuka pusat kontrol PETCARE+.</p><form id="login-form" onsubmit="return App.login(event)"><div class="form-group"><label for="email">Alamat email</label><div class="field">${ico('mail')}<input required type="email" id="email" autocomplete="username" placeholder="admin@petcareplus.id" value="admin@petcareplus.id"></div></div><div class="form-group"><label for="password">Password</label><div class="field">${ico('lock')}<input required type="password" id="password" autocomplete="current-password" value="admin123"><button type="button" aria-label="Tampilkan password" style="border:0;background:none;color:#62836b" onclick="App.togglePassword()">${ico('eye','i-sm')}</button></div></div><div class="login-options"><label><input type="checkbox" checked> Ingat saya (demo)</label><span>Mode prototype</span></div><button class="green-btn" type="submit" style="width:100%;height:48px">Masuk ke Dashboard ${ico('arrow','i-sm')}</button><div class="login-error" id="login-error" role="alert"></div></form><div class="login-hint"><strong>${ico('info','i-sm')} Akun Demo Administrator</strong><br>Email: <b>admin@petcareplus.id</b><br>Password: <b>admin123</b><br><span style="font-size:10px">Autentikasi simulasi di browser; bukan login server yang aman.</span></div></div></div></div>`)}
function renderAdmin(){let sel=menu.find(x=>x.id===state.page)||menu[0],date=new Intl.DateTimeFormat('id-ID',{day:'numeric',month:'long',year:'numeric'}).format(new Date());pageRoot(`<div class="admin ${state.collapsed?'is-collapsed':''} ${state.mobileOpen?'mobile-open':''} fade-in">${state.mobileOpen?'<div class="admin-mobile-dim" onclick="App.mobileMenu(false)"></div>':''}<aside class="sidebar"><div class="sidebar-head">${brand(true)}<button class="icon-btn" aria-label="Perkecil atau perluas sidebar" title="Perkecil / perluas" onclick="App.collapse()">${ico('menuFold','i-sm')}</button></div><div class="side-caption">MENU UTAMA</div><nav class="side-nav">${menu.map(x=>`<button title="${x.title}" class="nav-side-btn ${state.page===x.id?'active':''}" onclick="App.openPage('${x.id}')">${ico(x.icon)}<span>${x.title}</span></button>`).join('')}</nav><div class="sidebar-foot"><div class="side-admin-mini"><span class="mini-owner">AD</span><div class="mini-details"><strong>Admin PETCARE+</strong><small>Administrator</small></div></div><button class="nav-side-btn" onclick="App.logout()">${ico('logout')}<span>Keluar</span></button></div></aside><div class="content-shell"><header class="admin-topbar"><div class="topbar-left"><button class="icon-btn mobile-sidebar-button" onclick="App.mobileMenu(true)" aria-label="Buka sidebar">${ico('menu')}</button><div class="breadcrumbs">PETCARE+ / <span>${esc(sel.title)}</span></div></div><div class="topbar-right"><span class="top-date">${ico('calendar','i-sm')} ${date}</span><div class="notification-wrap"><button class="icon-btn" onclick="App.toggleNotifications()" aria-label="Notifikasi">${ico('bell')}<span class="notification-dot"></span></button>${state.notifications?`<div class="notification-popover"><h3>Aktivitas Terbaru</h3>${data.activities.slice(0,4).map(a=>`<div class="notify-item"><b>${esc(a.title)}</b><br>${esc(a.text)}</div>`).join('')}</div>`:''}</div><span class="admin-avatar">AD</span><div class="admin-person"><strong>Administrator</strong><small>Admin PETCARE+</small></div></div></header><main class="admin-main" id="admin-page">${renderAdminContent()}</main></div></div>`)}
function head(title,sub,act=''){return `<div class="page-title-row"><div><h1 class="page-heading">${title}</h1><p class="page-subtitle">${sub}</p></div><div class="page-action-group">${act}</div></div>`}
function renderAdminContent(){switch(state.page){case'dashboard':return dashboardPage();case'queues':return queuesPage();case'reports':return reportsPage();default:return tablePage(state.page)}}
const number=n=>new Intl.NumberFormat('id-ID').format(n);
function dashboardPage(){let activeQueue=data.queues.filter(q=>q.status!=='Selesai').length;let metrics=[['users','Pemilik Hewan',data.users.length,'users'],['pets','Hewan Terdaftar',data.pets.length,'paw'],['doctors','Dokter Hewan',data.doctors.length,'doctor'],['reservations','Total Reservasi',data.reservations.length,'calendar'],['queues','Antrean Aktif',activeQueue,'clock']];return head('Dashboard Administrator','Ringkasan aktivitas dan layanan klinik PETCARE+.',`<button class="outline-btn small-btn" onclick="App.resetDemo()">${ico('refresh','i-sm')} Reset Demo</button>`)+`<div class="stat-grid">${metrics.map(([page,name,val,ic])=>`<article class="stat-card glass" style="cursor:pointer" onclick="App.openPage('${page}')"><div class="surface-icon">${ico(ic)}</div><div class="stat-number">${number(val)}</div><div class="stat-name">${name}</div><div class="stat-foot">Lihat detail ${ico('arrow','i-sm')}</div></article>`).join('')}</div><div class="dashboard-banner"><div style="position:relative;z-index:1"><div style="font-size:10px;font-weight:800;letter-spacing:.1em;color:#bbefca;margin-bottom:10px">PUSAT KONTROL KLINIK</div><h3>Kelola setiap layanan<br>dengan lebih terhubung.</h3><p>Data reservasi, dokter, hewan, dan antrean dirangkum dalam satu antarmuka.</p></div><img src="${HERO_IMAGE}" alt="PETCARE+ illustration"></div><div class="dashboard-columns"><div class="panel glass"><div class="panel-title-row"><div><h3 class="panel-title">Aktivitas Reservasi</h3><div class="panel-sub">Tren layanan bulanan • ilustrasi data simulasi</div></div><span class="badge">30 Hari Terakhir</span></div>${lineChart()}</div><div class="panel glass"><div class="panel-title-row"><div><h3 class="panel-title">Distribusi Layanan</h3><div class="panel-sub">Berdasarkan reservasi terdaftar</div></div>${ico('more')}</div>${donut()}</div></div><div class="lower-columns"><div class="panel glass"><div class="panel-title-row"><h3 class="panel-title">Reservasi Terbaru</h3><button class="ghost-btn" onclick="App.openPage('reservations')">Lihat semua ${ico('arrow','i-sm')}</button></div>${simpleReservationTable(4)}</div><div class="panel glass"><div class="panel-title-row"><h3 class="panel-title">Aktivitas Terkini</h3>${ico('activity')}</div>${activityList(4)}</div></div>`}
function simpleReservationTable(limit=5){return `<div class="table-shell table-scroll"><table><thead><tr><th>Pasien</th><th>Layanan</th><th>Tanggal</th><th>Status</th></tr></thead><tbody>${data.reservations.slice(0,limit).map(r=>`<tr><td><div class="row-person"><span class="round-emoji">${animal(data.pets.find(x=>x.name===r.pet)?.type)}</span><span><strong>${esc(r.pet)}</strong><small>${esc(r.owner)}</small></span></div></td><td>${esc(r.service)}</td><td>${fmtDate(r.date)}</td><td>${badge(r.status)}</td></tr>`).join('')}</tbody></table></div>`}
function lineChart(){const vals=[25,31,29,44,55,47,64,58,73,79,82,98];const pts=vals.map((v,i)=>[48+i*(560/11),170-v*1.45]);const line=pts.map(([x,y],i)=>(i?'L':'M')+x+','+y).join(' ');const fill=`${line} L608,177 L48,177 Z`;return `<div class="chart-wrap line-chart"><svg viewBox="0 0 660 218" role="img" aria-label="Grafik aktivitas reservasi dari Januari sampai Desember"><defs><linearGradient id="line-gradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#65b47b" stop-opacity=".27"/><stop offset="100%" stop-color="#65b47b" stop-opacity="0"/></linearGradient></defs>${[30,65,100,135,170].map(y=>`<line x1="45" y1="${y}" x2="625" y2="${y}" class="chart-gridline"/>`).join('')}<path d="${fill}" fill="url(#line-gradient)"/><path d="${line}" stroke="#458d59" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>${pts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.6" fill="#408c55" stroke="#e8f5e9" stroke-width="2"/>`).join('')}${['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'].map((m,i)=>`<text x="${48+i*(560/11)}" y="204" class="chart-axis" text-anchor="middle">${m}</text>`).join('')}</svg></div>`}
function donut(){const entries=[['Pemeriksaan Umum','#468d58'],['Vaksinasi','#78b98a'],['Konsultasi','#a8d5af'],['Perawatan','#d8e9da']];let counts=entries.map(([n])=>data.reservations.filter(r=>r.service===n).length);let sum=counts.reduce((a,b)=>a+b,0);if(!sum){counts=[1,1,1,1];sum=4}let pos=0;let gradient=entries.map((e,i)=>{let a=pos;pos+=counts[i]/sum*100;return `${e[1]} ${a.toFixed(2)}% ${pos.toFixed(2)}%`}).join(',');return `<div class="donut-display"><div class="donut-ring" style="background:conic-gradient(${gradient})"><div class="donut-center"><strong>${data.reservations.length}</strong><small>Reservasi</small></div></div><div class="donut-legend">${entries.map((e,i)=>`<div class="legend-row"><span><i style="background:${e[1]}"></i>${e[0]}</span><b>${Math.round(counts[i]/sum*100)}%</b></div>`).join('')}</div></div>`}
function activityList(n=8){return `<div>${data.activities.slice(0,n).map(a=>`<div class="activity-row"><span class="activity-icon">${ico(a.icon||'check')}</span><div class="activity-text"><strong>${esc(a.title)}</strong><p>${esc(a.text)}</p><small>${esc(a.time)}</small></div></div>`).join('')||'<p class="note">Belum ada aktivitas.</p>'}</div>`}
function tablePage(page){const cfg=config[page];if(!cfg)return '';let actions=`<button class="outline-btn small-btn" onclick="App.exportCSV('${page}')">${ico('download','i-sm')} Export CSV</button><button class="green-btn small-btn" onclick="App.openForm('${page}')">${ico('plus','i-sm')} Tambah ${cfg.label}</button>`;let extra=page==='vaccines'?vaccineOverview():page==='schedules'?scheduleOverview():'';return head(cfg.title,cfg.subtitle,actions)+extra+`<div class="panel glass"><div class="table-toolbar"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label class="search-wrap">${ico('search')}<input aria-label="Cari ${cfg.label}" id="table-search" placeholder="Cari ${cfg.label.toLowerCase()}..." oninput="App.filterRows()"></label><select class="filter-select" id="table-filter" onchange="App.filterRows()"><option value="">${page==='pets'?'Semua Jenis':page==='examinations'?'Semua Dokter':'Semua Status'}</option>${(page==='users'?options.userStatus:page==='doctors'?options.doctorStatus:page==='schedules'?options.scheduleStatus:page==='reservations'?options.reservationStatus:page==='vaccines'?options.vaccineStatus:page==='pets'?options.petTypes:page==='examinations'?data.doctors.map(x=>x.name):[]).map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><span class="toolbar-count" id="row-count">${data[page].length} data</span></div>${tableRenderer(page)}</div>`}
function tableRenderer(page){let cfg=config[page];return `<div class="table-shell table-scroll"><table><thead><tr>${cfg.cols.map(c=>`<th>${c[1]}</th>`).join('')}<th style="text-align:right">Aksi</th></tr></thead><tbody>${data[page].map(x=>`<tr class="data-row" data-query="${esc(Object.values(x).join(' ').toLowerCase())}" data-status="${esc(x.status||x.type||x.doctor||'')}">${cfg.cols.map(([col])=>`<td>${cell(page,col,x)}</td>`).join('')}<td><div class="table-actions" style="justify-content:flex-end"><button title="Edit ${cfg.label}" class="row-action" onclick="App.openForm('${page}','${x.id}')">${ico('edit')}</button><button title="Hapus ${cfg.label}" class="row-action danger" onclick="App.askDelete('${page}','${x.id}')">${ico('trash')}</button></div></td></tr>`).join('')}</tbody></table><div class="empty-table" id="table-empty" style="display:${data[page].length?'none':'block'}">Tidak ada data yang cocok.</div></div>`}
function cell(page,col,r){let v=r[col]??'—';if(col==='status'){if(page==='reservations'||page==='queues'||page==='vaccines'){let opts=page==='reservations'?options.reservationStatus:page==='queues'?options.queueStatus:options.vaccineStatus;return `<select aria-label="Ubah status" class="status-select" onchange="App.changeStatus('${page}','${r.id}',this.value)">${opts.map(s=>`<option value="${s}" ${s===v?'selected':''}>${s}</option>`).join('')}</select>`}return badge(v)}if(col==='date')return fmtDate(v);if(col==='name'&&(page==='users'||page==='pets'||page==='doctors')){let face=page==='pets'?animal(r.type):page==='doctors'?'👩‍⚕️':'👤';return `<div class="row-person"><span class="round-emoji">${face}</span><span><strong>${esc(v)}</strong>${page==='pets'?`<small>${esc(r.gender||'')} • ${esc(r.breed||'')}</small>`:page==='doctors'?`<small>${esc(r.specialty)}</small>`:''}</span></div>`}if(col==='pet')return `<strong>${esc(v)}</strong>`;if(col==='code'||col==='number')return `<strong style="color:#2f7645">${esc(v)}</strong>`;return esc(v)}
function scheduleOverview(){return `<div class="mini-cards">${[['clock','Jam Operasional','08.00–17.00 WIB'],['calendar','Hari Praktik','Senin–Sabtu'],['doctor','Dokter Tersedia',String(data.doctors.filter(x=>x.status==='Aktif').length)]].map(([i,t,n])=>`<div class="mini-card glass"><div class="surface-icon">${ico(i)}</div><small>${t}</small><strong>${n}</strong></div>`).join('')}</div>`}
function vaccineOverview(){let upcoming=data.vaccines.filter(x=>x.status==='Terjadwal').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);return `<div class="mini-cards">${upcoming.map(x=>`<div class="mini-card glass"><div class="surface-icon">${ico('syringe')}</div><small>${esc(x.pet)} • ${esc(x.vaccine)}</small><strong style="font-size:14px;margin-top:8px">${fmtDate(x.date)}</strong><div style="margin-top:11px">${badge(x.status)}</div></div>`).join('')}</div>`}
function queuesPage(){let active=data.queues.filter(x=>x.status!=='Selesai'),called=data.queues.find(x=>x.status==='Dipanggil'||x.status==='Dilayani');return head('Manajemen Antrean','Pantau antrean pasien dan kelola status pelayanan secara terpusat.',`<button class="green-btn small-btn" onclick="App.callNext()">${ico('bell','i-sm')} Panggil Berikutnya</button><button class="outline-btn small-btn" onclick="App.openForm('queues')">${ico('plus','i-sm')} Tambah Antrean</button>`)+`<div class="queue-feature"><div class="queue-highlight"><div style="font-size:10px;font-weight:800;color:#c1efc9;letter-spacing:.1em">ANTREAN SEDANG DILAYANI</div><div class="queue-big">${called?esc(called.number):'—'}</div><div style="font-size:12px;font-weight:700;color:#c9edcf">${called?esc(called.pet)+' • '+esc(called.service):'Belum ada antrean dipanggil'}</div></div><div class="queue-stats"><div class="mini-stat glass"><strong>${active.length}</strong><span>Antrean Aktif</span></div><div class="mini-stat glass"><strong>${data.queues.filter(x=>x.status==='Menunggu').length}</strong><span>Menunggu</span></div><div class="mini-stat glass"><strong>${data.queues.filter(x=>x.status==='Selesai').length}</strong><span>Selesai</span></div></div></div><div class="panel glass"><div class="table-toolbar"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label class="search-wrap">${ico('search')}<input id="table-search" placeholder="Cari nomor atau pasien..." oninput="App.filterRows()"></label><select class="filter-select" id="table-filter" onchange="App.filterRows()"><option value="">Semua Status</option>${options.queueStatus.map(x=>`<option>${x}</option>`).join('')}</select></div><span class="toolbar-count" id="row-count">${data.queues.length} antrean</span></div>${tableRenderer('queues')}</div>`}
function reportsPage(){let done=data.reservations.filter(x=>x.status==='Selesai').length,completion=data.reservations.length?Math.round(done/data.reservations.length*100):0;return head('Laporan & Statistik','Rekap aktivitas klinik menggunakan data simulasi pada prototype.',`<button class="green-btn small-btn" onclick="App.exportCSV('reservations')">${ico('download','i-sm')} Unduh Laporan CSV</button>`)+`<div class="mini-cards"><div class="mini-card glass"><div class="surface-icon">${ico('calendar')}</div><small>Total Reservasi</small><strong>${data.reservations.length}</strong></div><div class="mini-card glass"><div class="surface-icon">${ico('checkcircle')}</div><small>Reservasi Selesai</small><strong>${done}</strong></div><div class="mini-card glass"><div class="surface-icon">${ico('activity')}</div><small>Tingkat Penyelesaian</small><strong>${completion}%</strong></div></div><div class="dashboard-columns"><div class="panel glass"><div class="panel-title-row"><div><h3 class="panel-title">Grafik Aktivitas Klinik</h3><div class="panel-sub">Visualisasi ilustratif untuk prototype</div></div></div>${lineChart()}</div><div class="panel glass"><div class="panel-title-row"><h3 class="panel-title">Layanan Terpopuler</h3></div>${donut()}</div></div><div class="lower-columns"><div class="panel glass"><div class="panel-title-row"><h3 class="panel-title">Ringkasan Operasional</h3></div>${[['Total pemilik terdaftar',data.users.length],['Hewan peliharaan',data.pets.length],['Dokter praktik aktif',data.doctors.filter(x=>x.status==='Aktif').length],['Antrean menunggu',data.queues.filter(x=>x.status==='Menunggu').length],['Pemeriksaan terdokumentasi',data.examinations.length],['Jadwal vaksin terencana',data.vaccines.filter(x=>x.status==='Terjadwal').length]].map(([k,v])=>`<div class="report-row"><span>${k}</span><strong>${v}</strong></div>`).join('')}</div><div class="panel glass"><div class="panel-title-row"><h3 class="panel-title">Log Aktivitas</h3></div>${activityList(7)}</div></div>`}
function inputField(f,r){let optionsSource=typeof f.opts==='function'?f.opts():f.opts;let value=r?.[f.name]??(f.name==='status'&&optionsSource?optionsSource[0]:f.type==='date'?isoDate(1):'');let input=f.type==='select'?`<select class="input-box" name="${f.name}" ${f.required?'required':''}><option value="">Pilih ${esc(f.label)}</option>${(optionsSource||[]).map(x=>`<option value="${esc(x)}" ${String(value)===String(x)?'selected':''}>${esc(x)}</option>`).join('')}</select>`:f.type==='textarea'?`<textarea class="input-box form-textarea" name="${f.name}" ${f.required?'required':''} placeholder="${esc(f.label)}">${esc(value)}</textarea>`:`<input class="input-box" name="${f.name}" type="${f.type}" value="${esc(value)}" ${f.required?'required':''} ${f.type==='number'?'min="0"':''} placeholder="${esc(f.label)}">`;return `<div class="form-group" style="margin-bottom:0"><label>${esc(f.label)}</label>${input}</div>`}
function openForm(page,id){const cfg=config[page];if(!cfg)return;const r=id?data[page].find(x=>x.id===id):null;const root=document.getElementById('modal-root');root.innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)App.closeModal()"><div class="modal-box" role="dialog" aria-modal="true" aria-label="${r?'Edit':'Tambah'} ${cfg.label}"><div class="modal-heading"><h2>${r?'Edit':'Tambah'} ${cfg.label}</h2><button class="icon-btn" onclick="App.closeModal()" aria-label="Tutup">${ico('close')}</button></div><form id="entity-form" onsubmit="return App.saveForm(event,'${page}','${id||''}')"><div class="modal-grid">${cfg.fields.map(f=>inputField(f,r)).join('')}</div><div class="modal-actions"><button type="button" class="outline-btn small-btn" onclick="App.closeModal()">Batal</button><button class="green-btn small-btn" type="submit">${ico('check','i-sm')} Simpan Data</button></div></form></div></div>`;setTimeout(()=>root.querySelector('input,select,textarea')?.focus(),35)}
function saveForm(ev,page,id){ev.preventDefault();let cfg=config[page],fd=new FormData(ev.target),r={};for(const f of cfg.fields)r[f.name]=String(fd.get(f.name)||'').trim();if(page==='reservations'){let p=data.pets.find(x=>x.name===r.pet);if(p&&r.owner!==p.owner){toast('Pemilik tidak sesuai dengan hewan terpilih.',true);return false}}if(page==='users'&&data.users.some(x=>x.email.toLowerCase()===r.email.toLowerCase()&&x.id!==id)){toast('Email sudah digunakan.',true);return false}if(id){const i=data[page].findIndex(x=>x.id===id);if(i>=0)data[page][i]={...data[page][i],...r};activity(cfg.label+' diperbarui',r.name||r.pet||r.doctor||'Data tersimpan')}else{r.id=uid();if(page==='reservations')r.code='RSV-'+String(Date.now()).slice(-6);if(page==='queues')r.number='A-'+String(Math.max(0,...data.queues.map(x=>Number(x.number.replace(/\D/g,''))||0))+1).padStart(3,'0');data[page].unshift(r);activity(cfg.label+' baru ditambahkan',r.name||r.pet||r.doctor||'Data tersimpan')}if(page==='reservations'){let rr=id?data.reservations.find(x=>x.id===id):r;syncQueue(rr)}if(page==='queues'){syncReservationForQueue(id?data.queues.find(x=>x.id===id):r)}persist();closeModal();renderAdmin();toast(cfg.label+(id?' berhasil diperbarui.':' berhasil ditambahkan.'));return false}
function syncQueue(res){if(!res)return;let q=data.queues.find(x=>x.reservation===res.code);if(['Dikonfirmasi','Dalam Pemeriksaan','Selesai'].includes(res.status)){let s={'Dikonfirmasi':'Menunggu','Dalam Pemeriksaan':'Dilayani','Selesai':'Selesai'}[res.status];if(q){q.pet=res.pet;q.owner=res.owner;q.service=res.service;q.status=s}else{data.queues.unshift({id:uid(),number:'A-'+String(Math.max(0,...data.queues.map(x=>Number(x.number.replace(/\D/g,''))||0))+1).padStart(3,'0'),pet:res.pet,owner:res.owner,service:res.service,status:s,reservation:res.code})}}if(res.status==='Dibatalkan'&&q)q.status='Selesai'}
function syncReservationForQueue(q){if(!q)return;let r=data.reservations.find(x=>x.code===q.reservation);if(r)r.status=q.status==='Selesai'?'Selesai':q.status==='Dilayani'?'Dalam Pemeriksaan':q.status==='Dipanggil'||q.status==='Menunggu'?'Dikonfirmasi':r.status}
function changeStatus(page,id,val){let rec=data[page].find(x=>x.id===id);if(!rec)return;rec.status=val;if(page==='reservations')syncQueue(rec);if(page==='queues')syncReservationForQueue(rec);activity('Status '+config[page].label+' diperbarui',(rec.code||rec.number||rec.pet||'')+' → '+val);persist();renderAdmin();toast('Status berhasil diperbarui menjadi '+val)}
function askDelete(page,id){const cfg=config[page],r=data[page].find(x=>x.id===id);if(!r)return;document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)App.closeModal()"><div class="modal-box confirm-dialog" role="alertdialog" aria-modal="true"><span class="surface-icon" style="background:#fae6e4;color:#bb5b53;margin-bottom:14px">${ico('trash')}</span><h2 style="font-size:20px;letter-spacing:-.04em;margin-bottom:10px">Hapus ${cfg.label}?</h2><p style="font-size:12px;color:#6f8175">Data <b>${esc(r.name||r.pet||r.code||r.number||r.doctor)}</b> akan dihapus dari prototype. Tindakan ini tidak dapat dibatalkan.</p><div class="modal-actions"><button class="outline-btn small-btn" onclick="App.closeModal()">Batal</button><button class="green-btn small-btn" style="background:#ad594f" onclick="App.deleteRecord('${page}','${id}')">Ya, Hapus</button></div></div></div>`}
function deleteRecord(page,id){data[page]=data[page].filter(x=>x.id!==id);activity(config[page].label+' dihapus','Penghapusan data melalui dashboard');persist();closeModal();renderAdmin();toast('Data berhasil dihapus.')}function closeModal(){document.getElementById('modal-root').innerHTML=''}
function filterRows(){const q=(document.getElementById('table-search')?.value||'').trim().toLowerCase(),s=document.getElementById('table-filter')?.value||'';let total=0;document.querySelectorAll('.data-row').forEach(tr=>{const ok=tr.dataset.query.includes(q)&&(!s||tr.dataset.status===s);tr.style.display=ok?'':'none';if(ok)total++});const count=document.getElementById('row-count');if(count)count.textContent=total+' data ditemukan';const empty=document.getElementById('table-empty');if(empty)empty.style.display=total?'none':'block'}
function callNext(){const cur=data.queues.find(q=>q.status==='Dipanggil'||q.status==='Dilayani');if(cur){cur.status='Selesai';syncReservationForQueue(cur)}const nxt=data.queues.find(q=>q.status==='Menunggu');if(nxt){nxt.status='Dipanggil';syncReservationForQueue(nxt);activity('Antrean '+nxt.number+' dipanggil',nxt.pet+' • '+nxt.service);toast('Antrean '+nxt.number+' untuk '+nxt.pet+' telah dipanggil')}else toast('Tidak ada antrean menunggu.',true);persist();renderAdmin()}
function exportCSV(page){const rows=data[page];if(!rows||!rows.length){toast('Belum ada data untuk diekspor.',true);return}const cfg=config[page];const cols=cfg.cols.map(([k])=>k);const csv=[cols.join(','),...rows.map(x=>cols.map(k=>'"'+String(x[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='PETCARE_'+page+'_'+isoDate(0)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Laporan CSV berhasil disiapkan.')}function resetDemo(){if(!confirm('Kembalikan seluruh data contoh dan hapus perubahan prototype?'))return;data=JSON.parse(JSON.stringify(SEED));persist();renderAdmin();toast('Data demo berhasil direset.')}
function navigate(v){state.menu=false;state.notifications=false;if(v==='admin'&&!state.authed)v='login';if(v==='landing'||v==='login'){state.view=v;render();return}if(!state.authed){state.view='login';render();return}state.view='admin';state.page=v==='admin'?'dashboard':v;state.mobileOpen=false;render()}
function openPage(id){if(!menu.some(x=>x.id===id))return;navigate(id)}
function login(ev){ev.preventDefault();const email=document.getElementById('email').value.trim().toLowerCase(),pass=document.getElementById('password').value;if(email==='admin@petcareplus.id'&&pass==='admin123'){state.authed=true;state.view='admin';state.page='dashboard';render();toast('Selamat datang, Administrator PETCARE+!')}else document.getElementById('login-error').textContent='Email atau password demo salah.';return false}
function logout(){state.authed=false;state.mobileOpen=false;state.view='landing';render();toast('Berhasil keluar dari sesi demo.')}function togglePassword(){const inp=document.getElementById('password');if(inp)inp.type=inp.type==='password'?'text':'password'}
window.App={goto:navigate,openPage,login,logout,togglePassword,collapse:()=>{state.collapsed=!state.collapsed;safeSet('petcare_collapse',state.collapsed?'1':'0');renderAdmin()},mobileMenu:v=>{state.mobileOpen=!!v;renderAdmin()},toggleMenu:()=>{state.menu=!state.menu;document.getElementById('site-nav')?.classList.toggle('menu-open',state.menu)},closeMenu:()=>{state.menu=false;document.getElementById('site-nav')?.classList.remove('menu-open')},toggleNotifications:()=>{state.notifications=!state.notifications;renderAdmin()},openForm,saveForm,closeModal,askDelete,deleteRecord,changeStatus,filterRows,callNext,exportCSV,resetDemo};
window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();if(state.notifications){state.notifications=false;renderAdmin()}}});
render();
})();
</script>
</body></html>
